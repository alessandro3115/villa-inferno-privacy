<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Verifica di sicurezza – Villa Inferno</title>
  <style>
    :root { color-scheme: dark; --gold: #d4af37; --bg: #121212; --text: #f5f5f5; --muted: #bdbdbd; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 420px; }
    .mark { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 22px; }
    p { margin: 0 auto 20px; max-width: 340px; color: var(--muted); }
    #widget { display: flex; justify-content: center; min-height: 66px; }
    #status { min-height: 24px; margin: 14px 0 0; color: var(--muted); font-size: 13px; }
    button { margin-top: 12px; padding: 10px 18px; border: 1px solid var(--gold); border-radius: 8px; background: transparent; color: var(--gold); font-weight: 700; }
    button[hidden] { display: none; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
  <main>
    <div class="mark">Villa Inferno · The Zen Circus Official Fan Club</div>
    <h1>Verifica di sicurezza</h1>
    <p>Completa la verifica per continuare con il recupero della password.</p>
    <div id="widget"></div>
    <div id="status" role="status" aria-live="polite">Caricamento della verifica…</div>
    <button id="retry" type="button" hidden>Riprova</button>
  </main>
  <script>
    (function () {
      'use strict';
      const SITE_KEY = '0x4AAAAAAFdlhDhT_w0EcPu9';
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      let widgetId = null;

      function sendToApp(payload) {
        try {
          if (window.TurnstileBridge && typeof window.TurnstileBridge.postMessage === 'function') {
            window.TurnstileBridge.postMessage(JSON.stringify(payload));
          }
        } catch (_) {}
      }

      function failed(message, code) {
        status.textContent = message;
        retry.hidden = false;
        sendToApp({ type: 'error', code: code || 'verification_failed' });
      }

      function renderWidget() {
        retry.hidden = true;
        status.textContent = 'Completa la verifica qui sotto.';
        if (!window.turnstile) {
          failed('Impossibile caricare la verifica. Controlla la connessione e riprova.', 'script_unavailable');
          return;
        }
        if (widgetId !== null) {
          try { window.turnstile.remove(widgetId); } catch (_) {}
          widgetId = null;
        }
        try {
          widgetId = window.turnstile.render('#widget', {
            sitekey: SITE_KEY,
            theme: 'dark',
            language: 'it',
            callback: function (token) {
              status.textContent = 'Verifica completata.';
              retry.hidden = true;
              sendToApp({ type: 'success', token: token });
            },
            'expired-callback': function () {
              status.textContent = 'La verifica è scaduta. Ripeti la verifica.';
              sendToApp({ type: 'expired' });
              retry.hidden = false;
            },
            'error-callback': function (code) {
              failed('Verifica non riuscita. Premi Riprova.', code);
              return true;
            }
          });
        } catch (_) {
          failed('Impossibile avviare la verifica. Premi Riprova.', 'render_failed');
        }
      }

      retry.addEventListener('click', renderWidget);
      window.addEventListener('load', function () {
        if (window.turnstile) {
          renderWidget();
        } else {
          let attempts = 0;
          const timer = window.setInterval(function () {
            attempts++;
            if (window.turnstile) {
              window.clearInterval(timer);
              renderWidget();
            } else if (attempts >= 30) {
              window.clearInterval(timer);
              failed('Cloudflare non è raggiungibile. Controlla la connessione e riprova.', 'script_timeout');
            }
          }, 250);
        }
      });
    })();
  </script>
</body>
</html>
